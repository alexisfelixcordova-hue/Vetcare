services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1434:1433" # Mapeado al puerto 1434 para evitar conflictos en tu PC
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Contenedor de un solo uso: crea la base "prueba" y corre el script de tablas.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database:/scripts:ro
    environment:
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    entrypoint: >
      bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"IF DB_ID('prueba') IS NULL CREATE DATABASE prueba\" &&
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /scripts/prueba-usuarios.sql
      "

  app:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 1433
      DB_NAME: prueba
      DB_USER: sa
      DB_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  mssql_data: